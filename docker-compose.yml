# Runs the backend API container only.
# USE_DOCKER=false is intentional: Docker-in-Docker is not configured.
# Secure sandboxing needs the Node process on a host with Docker daemon
# and USE_DOCKER=true in server/.env.
#
# Env: server/.env (same names as server/.env.example)

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - USE_DOCKER=false
    restart: unless-stopped
